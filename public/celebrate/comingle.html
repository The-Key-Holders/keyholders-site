<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
    <title>Co-Mingle · Guest Hub</title>
    <link rel="stylesheet" href="css/party.css" />
    <script src="js/head-boot.js"></script>
  </head>
  <body data-page="comingle">
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark">🤝</div>
        <div>
          <h1>Co-Mingle Quest</h1>
          <p>Talk to humans. Earn XP. +25 each.</p>
        </div>
      </div>
      <div id="profile-chip"></div>
      <div id="prize-banner" hidden></div>
    </header>
    <main>
      <section class="hero">
        <h2>Icebreakers with receipts</h2>
        <p class="lede">Find the person, ask the question, type what they said. No social anxiety? Cool. A little social anxiety? Also valid. Still try.</p>
        <p class="muted" id="score-note"></p>
      </section>
      <div id="list"></div>
    </main>
    <nav id="bottom-nav"></nav>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/shell.js"></script>
    <script>
      (async function () {
        const p = PartyProfile.requireOrRedirect();
        if (!p) return;
        await PartyUI.hydrateConfigFromApi();
        const FALLBACK = [
          {
            id: "allwhite_love",
            prompt: "Find Dani or Javad (the all-white couple) and ask who said “I love you” first.",
            hint: "One name. Cross-check with trivia if you’re competitive.",
            points: 25,
          },
          {
            id: "dessert_heist",
            prompt: "Find Ronni or Alondra near dessert and ask which cupcake flavor they would steal first.",
            hint: "Any real flavor word counts.",
            points: 25,
          },
          {
            id: "pet_intel",
            prompt: "Find a guest who has met the pets and ask the dog’s name.",
            hint: "Four legs. Maximum chaos.",
            points: 25,
          },
          {
            id: "concert_crew",
            prompt: "Find someone from the Hilary Duff concert crew and ask who else was in that night’s selfie.",
            hint: "Name-drop one: Dani, Roni, Lupe, Briauna, Chelsea…",
            points: 25,
          },
          {
            id: "hike_liar",
            prompt: "Find an outdoorsy friend and ask who is more likely to say “it’s not that far” on a hike.",
            hint: "Dani, Javad, or both.",
            points: 25,
          },
        ];
        const remote = (PARTY_CONFIG._remote && PARTY_CONFIG._remote.comingle) || [];
        const remoteIsLegacy =
          remote.length > 0 &&
          remote.every((q) => ["chad", "cupcakes", "homelab"].includes(String(q.id)));
        const prompts =
          remote.length >= 5 && !remoteIsLegacy ? remote : FALLBACK;
        const scoring = (PARTY_CONFIG._remote && PARTY_CONFIG._remote.scoring) || {};
        document.getElementById("score-note").textContent = scoring.message || "";
        const list = document.getElementById("list");
        if (!prompts.length) {
          list.innerHTML = `<section class="card"><p class="muted">No co-mingle quests yet. Host can add them in Host desk → Co-Mingle CSV.</p></section>`;
          return;
        }
        list.innerHTML = prompts
          .map(
            (q) => `
          <section class="card" data-id="${q.id}">
            <h3>${q.prompt}</h3>
            <p class="muted">${q.hint || ""} · ${q.points || 25} pts</p>
            <div class="field"><label>Their answer</label><input id="a-${q.id}" placeholder="Type it here" /></div>
            <button class="btn btn-block" data-submit="${q.id}">Submit</button>
            <p class="muted" id="m-${q.id}"></p>
          </section>`
          )
          .join("");
        list.querySelectorAll("[data-submit]").forEach((btn) => {
          btn.onclick = async () => {
            const id = btn.getAttribute("data-submit");
            const answer = document.getElementById("a-" + id).value.trim();
            try {
              const res = await PartyAPI.comingle({ profileId: p.id, promptId: id, answer });
              document.getElementById("m-" + id).textContent = res.message + (res.points ? ` (+${res.points})` : "");
              if (res.correct) PartyUI.confetti(1000);
              PartyUI.toast(res.correct ? "Verified. Social legendary." : "Not verified yet.");
            } catch (e) {
              PartyUI.toast(e.message || "Failed");
            }
          };
        });
      })();
    </script>
  </body>
</html>
