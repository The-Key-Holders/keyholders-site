server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Guest static site
    location / {
        try_files $uri $uri/ /index.html;
    }

    client_max_body_size 10m;

    # API reverse proxy (docker service name: party-api)
    location /api/ {
        proxy_pass http://party-api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 10m;
    }

    location = /api/health {
        proxy_pass http://party-api:8080/api/health;
    }
}
