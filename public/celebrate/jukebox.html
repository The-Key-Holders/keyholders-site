<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
    <title>Jukebox · Guest Hub</title>
    <link rel="stylesheet" href="css/party.css" />
    <script src="js/head-boot.js"></script>
  </head>
  <body data-page="jukebox">
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark">🎵</div>
        <div>
          <h1>Collaborative Jukebox</h1>
          <p>Request a track · hosts decide</p>
        </div>
      </div>
      <div id="profile-chip"></div>
      <div id="prize-banner" hidden></div>
    </header>
    <main>
      <section class="hero">
        <h2>Song requests</h2>
        <p class="lede">Type a track + artist. Everyone can see the queue. Hosts / DJ helpers will consider (no guarantees, no mosh pits unless invited).</p>
      </section>
      <section class="card">
        <div class="field"><label>Song title</label><input id="title" placeholder="September" /></div>
        <div class="field"><label>Artist</label><input id="artist" placeholder="Earth, Wind & Fire" /></div>
        <button class="btn btn-block" id="go">Add to queue</button>
      </section>
      <section class="card">
        <h3>Queue</h3>
        <div id="q" class="muted">Loading…</div>
      </section>
    </main>
    <nav id="bottom-nav"></nav>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/shell.js"></script>
    <script>
      (async function () {
        const p = PartyProfile.requireOrRedirect();
        if (!p) return;
        async function load() {
          const data = await PartyAPI.getSongs();
          document.getElementById("q").innerHTML = (data.songs || [])
            .map(
              (s) =>
                `<p><strong>${PartyUI.escapeHtml(s.title)}</strong>${s.artist ? " — " + PartyUI.escapeHtml(s.artist) : ""} <span class="muted">· ${PartyUI.escapeHtml(s.display_name || "")}</span></p>`
            )
            .join("") || "Queue is empty. Be the first hero.";
        }
        document.getElementById("go").onclick = async () => {
          const title = document.getElementById("title").value.trim();
          const artist = document.getElementById("artist").value.trim();
          if (!title) return PartyUI.toast("Need a song title");
          await PartyAPI.postSong({
            profileId: p.id,
            displayName: PartyProfile.display(p),
            title,
            artist,
          });
          document.getElementById("title").value = "";
          document.getElementById("artist").value = "";
          PartyUI.toast("Requested.");
          load();
        };
        load();
        setInterval(load, 15000);
      })();
    </script>
  </body>
</html>
