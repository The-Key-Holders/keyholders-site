<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
    <title>He / She Said · Guest Hub</title>
    <link rel="stylesheet" href="css/party.css" />
    <script src="js/head-boot.js"></script>
  </head>
  <body data-page="he-said">
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark">⚡</div>
        <div>
          <h1>He Said / She Said</h1>
          <p>Speed round · lightly scientific</p>
        </div>
      </div>
      <div id="profile-chip"></div>
      <div id="prize-banner" hidden></div>
    </header>
    <main>
      <section class="hero" id="intro">
        <h2>Who is more likely?</h2>
        <p class="lede">Answer fast. Correct answers pay; speed is a tiny bonus (we are not the Olympics).</p>
        <p class="muted" id="pack-badge" style="margin-top:0.5rem">Loading questions…</p>
        <p class="muted" id="pack-error" hidden style="color:#f88;margin-top:0.5rem"></p>
        <button class="btn" id="start" disabled>Go</button>
      </section>
      <section class="card" id="play" hidden>
        <div class="progress"><i id="bar"></i></div>
        <h3 id="qtext"></h3>
        <div id="choices"></div>
      </section>
      <section class="card" id="done" hidden>
        <h3 id="result-title"></h3>
        <a class="btn btn-block" href="leaderboard.html">Leaderboard</a>
        <button class="btn btn-secondary btn-block" id="retry" style="margin-top: 0.5rem">Again</button>
      </section>
    </main>
    <nav id="bottom-nav"></nav>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/shell.js"></script>
    <script>
      (async function () {
        const p = PartyProfile.requireOrRedirect();
        if (!p) return;
        const badge = document.getElementById("pack-badge");
        const errEl = document.getElementById("pack-error");
        const startBtn = document.getElementById("start");
        let data;
        try {
          const packQs = "v=4&ts=" + Date.now();
          const remote = await fetch("/api/content/he-said?" + packQs, { cache: "no-store" }).then((r) =>
            r.ok ? r.json() : null
          );
          const staticPack = await fetch("data/he-said-she-said.json?" + packQs, { cache: "no-store" })
            .then((r) => (r.ok ? r.json() : null))
            .catch(() => null);
          data = remote && remote.questions && remote.questions.length >= 12 ? remote : staticPack;
          if (!data || !data.questions || data.questions.length < 12) {
            throw new Error("He/She pack missing or too short");
          }
          const blob = data.questions.map((q) => q.q || "").join("\n");
          if (!/dramatic/i.test(blob) || !/hangry/i.test(blob)) {
            throw new Error("He/She pack looks stale (missing roast markers)");
          }
        } catch (e) {
          errEl.hidden = false;
          errEl.textContent = "He/She pack failed: " + (e.message || e);
          badge.textContent = "Pack error";
          return;
        }
        const qs = data.questions;
        badge.textContent =
          (data.contentPackId || "pack") +
          " · v" +
          (data.contentPackVersion || "?") +
          " · " +
          qs.length +
          " questions";
        startBtn.disabled = false;
        let i = 0;
        let score = 0;
        const t0 = performance.now();
        let qStart = t0;

        function showQ() {
          if (i >= qs.length) return finish();
          qStart = performance.now();
          document.getElementById("qtext").textContent = qs[i].q;
          document.getElementById("bar").style.width = `${(i / qs.length) * 100}%`;
          const box = document.getElementById("choices");
          box.innerHTML = "";
          qs[i].choices.forEach((c, idx) => {
            const b = document.createElement("button");
            b.type = "button";
            b.className = "choice";
            b.textContent = c;
            b.onclick = () => {
              const elapsed = performance.now() - qStart;
              const ok = idx === qs[i].answer;
              if (ok) {
                score += 10;
                if (elapsed < 2500) score += 2;
              }
              b.classList.add(ok ? "correct" : "wrong");
              [...box.children].forEach((x) => (x.disabled = true));
              setTimeout(() => {
                i++;
                showQ();
              }, 400);
            };
            box.appendChild(b);
          });
        }

        async function finish() {
          document.getElementById("play").hidden = true;
          document.getElementById("done").hidden = false;
          document.getElementById("result-title").textContent = `Score: ${score}`;
          PartyUI.confetti(1000);
          try {
            if (!String(p.id).startsWith("local-")) {
              await PartyAPI.postScore({
                profileId: p.id,
                game: "he-said-she-said",
                score,
                maxScore: qs.length * 12,
                durationMs: Math.round(performance.now() - t0),
              });
            }
          } catch (_) {}
        }

        document.getElementById("start").onclick = () => {
          document.getElementById("intro").hidden = true;
          document.getElementById("play").hidden = false;
          showQ();
        };
        document.getElementById("retry").onclick = () => location.reload();
      })();
    </script>
  </body>
</html>
