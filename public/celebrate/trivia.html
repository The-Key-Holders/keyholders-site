<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
    <title>Trivia · Guest Hub</title>
    <link rel="stylesheet" href="css/party.css" />
    <script src="js/head-boot.js"></script>
  </head>
  <body data-page="trivia">
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark">🧠</div>
        <div>
          <h1>Couple Trivia</h1>
          <p>Listen-at-dinner simulator</p>
        </div>
      </div>
      <div id="profile-chip"></div>
      <div id="prize-banner" hidden></div>
    </header>
    <main>
      <section class="hero" id="intro">
        <h2>How well do you know Dani & Javad?</h2>
        <p class="lede">Best score counts. Wrong answers still earn our eternal gratitude for trying.</p>
        <button class="btn" id="start">Start trivia</button>
      </section>
      <section class="card" id="play" hidden>
        <div class="progress"><i id="bar"></i></div>
        <p class="muted" id="qnum"></p>
        <h3 id="qtext"></h3>
        <div id="choices"></div>
      </section>
      <section class="card" id="done" hidden>
        <h3 id="result-title">Done</h3>
        <p id="result-body" class="muted"></p>
        <a class="btn btn-block" href="leaderboard.html">See leaderboard</a>
        <button class="btn btn-secondary btn-block" id="retry" style="margin-top: 0.5rem">Play again</button>
      </section>
    </main>
    <nav id="bottom-nav"></nav>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/shell.js"></script>
    <script>
      (async function () {
        const p = PartyProfile.requireOrRedirect();
        if (!p) return;
        let data;
        try {
          // Prefer static pack (always redeployed); fall back to API host content
          const local = await fetch("data/trivia.json?v=3").then((r) => (r.ok ? r.json() : null));
          if (local && Array.isArray(local.questions) && local.questions.length) {
            data = local;
          } else {
            const remote = await fetch("/api/content/trivia").then((r) => (r.ok ? r.json() : null));
            data = remote && remote.questions ? remote : local;
          }
        } catch {
          data = await fetch("data/trivia.json?v=3").then((r) => r.json());
        }
        let i = 0;
        let score = 0;
        const t0 = performance.now();
        const qs = data.questions;

        function titleFor(s, max) {
          const r = s / max;
          if (r >= 0.9) return "Best Man / Maid energy";
          if (r >= 0.7) return "Solid plus-one";
          if (r >= 0.5) return "Needs more margaritas";
          return "Here for the tacos (valid)";
        }

        function showQ() {
          if (i >= qs.length) return finish();
          document.getElementById("qnum").textContent = `Question ${i + 1} / ${qs.length}`;
          document.getElementById("qtext").textContent = qs[i].q;
          document.getElementById("bar").style.width = `${(i / qs.length) * 100}%`;
          const box = document.getElementById("choices");
          box.innerHTML = "";
          qs[i].choices.forEach((c, idx) => {
            const b = document.createElement("button");
            b.type = "button";
            b.className = "choice";
            b.textContent = c;
            b.onclick = () => {
              const ok = idx === qs[i].answer;
              b.classList.add(ok ? "correct" : "wrong");
              const ppc = data.pointsPerCorrect || 15;
              if (ok) score += ppc;
              else {
                const right = box.children[qs[i].answer];
                if (right) right.classList.add("correct");
              }
              [...box.children].forEach((x) => (x.disabled = true));
              setTimeout(() => {
                i++;
                showQ();
              }, 550);
            };
            box.appendChild(b);
          });
        }

        async function finish() {
          document.getElementById("play").hidden = true;
          document.getElementById("done").hidden = false;
          document.getElementById("bar").style.width = "100%";
          const max = qs.length * (data.pointsPerCorrect || 15);
          const durationMs = Math.round(performance.now() - t0);
          document.getElementById("result-title").textContent = `${titleFor(score, max)} · ${score}/${max}`;
          document.getElementById("result-body").textContent =
            "Thanks for playing. Your best run feeds the leaderboard (and our egos, slightly).";
          PartyUI.confetti();
          PartyProfile.local.patch({ trivia: true });
          try {
            if (!String(p.id).startsWith("local-")) {
              await PartyAPI.postScore({
                profileId: p.id,
                game: "trivia",
                score,
                maxScore: max,
                durationMs,
              });
            }
          } catch (e) {
            PartyUI.toast("Score saved locally vibe only — API offline");
          }
        }

        document.getElementById("start").onclick = () => {
          document.getElementById("intro").hidden = true;
          document.getElementById("play").hidden = false;
          showQ();
        };
        document.getElementById("retry").onclick = () => location.reload();
      })();
    </script>
  </body>
</html>
