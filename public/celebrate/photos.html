<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
    <title>Photos · Guest Hub</title>
    <link rel="stylesheet" href="css/party.css" />
    <script src="js/head-boot.js"></script>
  </head>
  <body data-page="photos">
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark">📸</div>
        <div>
          <h1>Shared album</h1>
          <p>Evidence that joy occurred</p>
        </div>
      </div>
      <div id="profile-chip"></div>
      <div id="prize-banner" hidden></div>
    </header>
    <main>
      <section class="hero">
        <h2>Dump the pixels here</h2>
        <p class="lede">
          One shared Google Photos album for everyone. No, you do not need to email us 47 HEIC files.
        </p>
      </section>
      <section class="card">
        <a class="btn btn-block" id="open-album" target="_blank" rel="noopener">Open photo album 📷</a>
        <button class="btn btn-secondary btn-block" id="stamp-photo" style="margin-top: 0.6rem">
          I added a photo (passport stamp)
        </button>
        <p class="muted" style="margin-top: 0.75rem">
          Tip: the paper QR near the arch goes to the same place. Redundancy is romantic.
        </p>
      </section>
    </main>
    <nav id="bottom-nav"></nav>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/shell.js"></script>
    <script>
      const url = PARTY_CONFIG.photosUrl;
      document.getElementById("open-album").href = url;
      document.getElementById("stamp-photo").onclick = async () => {
        const p = PartyProfile.requireOrRedirect();
        if (!p) return;
        try {
          if (!String(p.id).startsWith("local-")) {
            await PartyAPI.checkin({ profileId: p.id, kind: "photo" });
          }
          PartyProfile.local.patch({ photo: true });
          PartyUI.confetti();
          PartyUI.toast("Stamp logged. You're a documentarian now.");
        } catch (e) {
          PartyProfile.local.patch({ photo: true });
          PartyUI.toast("Saved on this phone (API busy).");
        }
      };
    </script>
  </body>
</html>
